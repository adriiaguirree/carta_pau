<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Para Pau</title>
    <link rel="stylesheet" href="styles.css?v=20260623-40">
  </head>
  <body>
    <div class="loader" id="loader" aria-hidden="true">
      <div class="loader-mark">P</div>
      <p>Preparando tu carta...</p>
    </div>
    <button class="audio-toggle" id="audioToggle" type="button" aria-pressed="false">Música</button>
    <audio id="song" src="media/cancion.mp4?v=20260623-40" preload="auto" autoplay loop></audio>
    <button class="qr-toggle" id="qrToggle" type="button" aria-expanded="false">QR</button>
    <aside class="qr-panel" id="qrPanel" aria-label="Código QR para abrir la carta en celular">
      <img src="media/qr-carta-pau.png?v=20260623-40" alt="QR de la carta para Pau">
      <p>Escanea para abrirla en el celular.</p>
    </aside>
    <div class="orientation-prompt" aria-hidden="true">
      <div>
        <span>↻</span>
        <p>Gira tu celular</p>
      </div>
    </div>
    <main class="experience" aria-live="polite">
      <section class="scene scene-heart is-active" id="heartScene">
        <div class="stars" aria-hidden="true"></div>
        <canvas class="dot-canvas" id="dotCanvas" aria-hidden="true"></canvas>
        <div class="intro-copy">
          <p class="eyebrow">Feliz cumple mi amor <3</p>
          <h1>Para ti,</h1>
          <p>Un pequeño pedacito de todo lo que significas para mí.</p>
          <button class="primary-button press-button" id="openLetter" type="button" aria-label="Abrir recuerdos">
            Presiona aquí
          </button>
        </div>
      </section>

      <section class="scene scene-memory" id="memoryScene" aria-hidden="true">
        <div class="memory-board" id="memoryBoard" aria-label="Collage de recuerdos de vacaciones"></div>
        <div class="memory-actions" id="memoryActions">
          <button class="primary-button memory-letter-button" id="openFinalLetter" type="button" aria-label="Abrir carta">P</button>
          <button class="ghost-button icon-button" id="downloadMemory" type="button" aria-label="Guardar collage de recuerdos">↓</button>
        </div>
      </section>

      <section class="scene scene-letter" id="letterScene" aria-hidden="true">
        <div class="letter-beach-stage" aria-hidden="true">
          <span class="letter-sea"></span>
          <span class="letter-shore"></span>
          <div class="letter-beach-photos" id="letterBeachPhotos"></div>
          <span class="letter-beach-decor decor-a"></span>
          <span class="letter-beach-decor decor-b"></span>
        </div>
        <div class="letter-shimmer" aria-hidden="true"></div>
        <div class="envelope" id="envelope">
          <div class="envelope-back"></div>
          <div class="envelope-front"></div>
          <div class="envelope-flap"></div>
          <div class="seal" aria-hidden="true">P</div>
        </div>
        <article class="paper" aria-label="Carta de cumpleaños para Pau">
          <header class="paper-header">
            <p class="letter-date">29/06</p>
            <p class="letter-greeting">Pau:</p>
          </header>
          <div class="letter-text">
            <span id="letterText"></span><span class="type-cursor" id="cursor" aria-hidden="true"></span>
          </div>
          <footer class="paper-actions">
            <button class="ghost-button" id="skipTyping" type="button">Ver completa</button>
            <button class="ghost-button" id="rereadLetter" type="button">Leer de nuevo</button>
            <button class="ghost-button" id="downloadLetter" type="button">Guardar carta</button>
            <button class="ghost-button" id="viewMemories" type="button">Ver recuerdos</button>
            <button class="ghost-button" id="restart" type="button">Volver al corazón</button>
          </footer>
        </article>
        <div class="final-card" id="finalCard" aria-live="polite">
          <p>Feliz cumpleaños, Pau.</p>
          <span>Te amo con todo mi corazón.</span>
          <small>hecho con amor por Adrián</small>
        </div>
        <div class="final-bloom" id="finalBloom" aria-hidden="true"></div>
      </section>
    </main>

    <div class="photo-viewer" id="photoViewer" aria-hidden="true" role="dialog" aria-label="Foto de recuerdo">
      <button class="photo-viewer-close" id="photoViewerClose" type="button" aria-label="Cerrar foto">×</button>
      <img id="photoViewerImage" src="" alt="Recuerdo de vacaciones">
    </div>
    <div class="scene-transition" id="sceneTransition" aria-hidden="true"></div>
    <div class="travel-transition" id="travelTransition" aria-hidden="true">
      <div class="travel-stars" aria-hidden="true"></div>
      <div class="travel-orbit" aria-hidden="true">
        <div class="travel-earth">
          <span class="travel-cloud cloud-a"></span>
          <span class="travel-cloud cloud-b"></span>
          <span class="travel-cloud cloud-c"></span>
          <span class="mexico-marker"></span>
          <span class="mexico-glow"></span>
        </div>
      </div>
      <div class="travel-beach" aria-hidden="true">
        <span class="travel-sea"></span>
        <span class="travel-shore"></span>
        <span class="travel-sand"></span>
        <span class="travel-hydrangea bloom-a"></span>
        <span class="travel-hydrangea bloom-b"></span>
        <span class="travel-paper-preview"></span>
      </div>
    </div>

    <script src="script.js?v=20260623-40"></script>
  </body>
</html>
